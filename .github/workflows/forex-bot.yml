name: Forex Signal Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC)
  workflow_dispatch:           # manual trigger from GitHub UI

# Prevent two runs overlapping — queue rather than cancel
concurrency:
  group: forex-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit DB state back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The script uses ~/Desktop/ paths — create the dir and restore DB
      - name: Restore state
        run: |
          mkdir -p $HOME/Desktop
          if [ -f forex_bot.db ]; then
            cp forex_bot.db $HOME/Desktop/forex_bot.db
            echo "DB restored ($(du -sh forex_bot.db | cut -f1))"
          else
            echo "No existing DB — fresh start"
          fi

      - name: Check open positions (SL/TP hits)
        run: python3 forex_bot.py check

      - name: Scan for new signals
        run: python3 forex_bot.py scan

      # Commit updated DB and last 1000 log lines back to repo
      - name: Persist state
        run: |
          cp $HOME/Desktop/forex_bot.db forex_bot.db 2>/dev/null || true
          if [ -f $HOME/Desktop/forex_bot.log ]; then
            tail -1000 $HOME/Desktop/forex_bot.log > forex_bot.log
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add forex_bot.db forex_bot.log
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git pull --rebase origin main
            git commit -m "bot: run $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
